name: CI (Build, Test, Lint)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:  # <-- This enables manual triggering of the workflow from the GitHub Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Format (ruff)
        run: |
          ruff format app
      - name: Lint (ruff)
        run: |
          ruff check app
          ruff format --check app
      - name: Test (pytest)
        run: pytest -q
